<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>退職届作成アプリ - Interactive Paper Canvas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Sawarabi Mincho for Japanese Traditional Writing -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      touch-action: none; /* Prevent default touch scrolling when dragging paper */
      user-select: none;
    }

    /* Horizontal modern writing style (Read from left to right) */
    .paper-content {
      line-height: 2.2;
      letter-spacing: 0.05em;
    }

    /* Grid background for canvas workspace */
    .bg-grid-pattern {
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    /* Paper texture and subtle shadows */
    .paper-shadow {
      box-shadow: 
        0 25px 35px -5px rgba(0, 0, 0, 0.35),
        0 10px 15px -5px rgba(0, 0, 0, 0.2),
        0 0 15px rgba(0, 0, 0, 0.1);
    }

    /* Realistic Paper Texture simulation via CSS SVG overlay */
    .paper-texture {
      background-color: #fdfbf7;
      background-image: radial-gradient(#e2ddd5 0.75px, transparent 0.75px);
      background-size: 14px 14px;
    }

    /* Custom Scrollbar for side panel */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(250,250,250,0.2);
      border-radius: 3px;
    }

    /* Print Styles: Hide all UI elements except the paper itself */
    @media print {
      body {
        background: none !important;
        touch-action: auto !important;
        user-select: auto !important;
        overflow: visible !important;
      }
      #workspace, #ui-panel, #floating-controls {
        display: none !important;
      }
      #print-area {
        display: block !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .print-paper {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        box-shadow: none !important;
        border: none !important;
        transform: none !important;
        background: #ffffff !important;
      }
    }

    @media screen {
      #print-area {
        display: none;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen overflow-hidden flex flex-col md:flex-row">

  <!-- ================= CONTROL PANEL (LEFT / SIDE) ================= -->
  <aside id="ui-panel" class="w-full md:w-96 bg-slate-800/90 backdrop-blur-md border-b md:border-b-0 md:border-r border-slate-700/60 z-30 flex flex-col max-h-[45vh] md:max-h-screen transition-all duration-300">
    
    <!-- Panel Header -->
    <div class="p-4 border-b border-slate-700/60 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-scroll text-amber-400 text-xl"></i>
        <h1 class="font-bold text-lg tracking-wider text-slate-100">退職届 作成・プレビュー</h1>
      </div>
      <button id="toggle-panel-btn" class="md:hidden text-slate-400 hover:text-white p-1">
        <i class="fa-solid fa-chevron-down" id="panel-chevron"></i>
      </button>
    </div>

    <!-- Input Form (Scrollable) -->
    <div id="form-container" class="p-4 overflow-y-auto space-y-4 flex-1 text-sm font-sans">
      
      <!-- Doc Type -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">表題 (種類)</label>
        <select id="input-title" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400">
          <option value="退職届">退職届 (決定後の提出)</option>
          <option value="退職願">退職願 (打診・申し出)</option>
        </select>
      </div>

      <!-- Company Name & Representative -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">会社名 / 宛名</label>
        <input type="text" id="input-company" placeholder="株式会社サンプル 代表取締役 〇〇 殿" 
               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400 transition-colors">
      </div>

      <!-- Department & Name -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">所属部署</label>
          <input type="text" id="input-dept" placeholder="営業部 営業第一課" 
                 class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">氏名</label>
          <input type="text" id="input-name" placeholder="山田 太郎" 
                 class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <!-- Unified Submission & Effective Date -->
      <div>
        <label class="block text-xs font-medium text-amber-400 font-semibold mb-1">
          <i class="fa-solid fa-calendar-day mr-1"></i>提出日 兼 提出指定日
        </label>
        <input type="date" id="input-date" 
               class="w-full bg-slate-900/80 border border-amber-500/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400">
        <p class="text-[11px] text-slate-400 mt-1">※記載日および退職年月日の両方にこの日付が自動連携されます。</p>
      </div>

      <!-- Reason for Resignation -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">退職理由</label>
        <select id="input-reason-preset" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400 mb-2">
          <option value="一身上の都合により">一身上の都合により (自己都合 - 定型)</option>
          <option value="契約期間満了により">契約期間満了により</option>
          <option value="custom">直接入力する</option>
        </select>
        <input type="text" id="input-reason-custom" placeholder="理由を入力 (例: 〇〇の理由により)" 
               class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-400 hidden">
      </div>

      <div class="p-3 bg-amber-500/10 border border-amber-500/20 rounded-lg text-xs text-amber-200/80 leading-relaxed">
        <i class="fa-solid fa-circle-info mr-1"></i> 入力情報はローカルストレージに保持され、いつでも印刷可能です。
      </div>

    </div>

    <!-- Action Buttons Footer -->
    <div class="p-4 border-t border-slate-700/60 flex gap-2">
      <button id="print-btn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 px-4 rounded-lg shadow flex items-center justify-center gap-2 transition-all active:scale-95">
        <i class="fa-solid fa-print"></i> 印刷 / PDF出力
      </button>
      <button id="reset-pos-btn" title="位置リセット" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2.5 rounded-lg transition-colors">
        <i class="fa-solid fa-arrows-to-dot"></i>
      </button>
    </div>

  </aside>

  <!-- ================= CANVAS WORKSPACE (RIGHT / MAIN) ================= -->
  <main id="workspace" class="flex-1 relative bg-slate-950 bg-grid-pattern overflow-hidden flex items-center justify-center cursor-grab active:cursor-grabbing">
    
    <!-- Floating Instruction Banner -->
    <div class="absolute top-4 left-4 z-10 pointer-events-none bg-slate-900/80 border border-slate-700/50 backdrop-blur px-3 py-1.5 rounded-full text-xs text-slate-300 flex items-center gap-2 shadow">
      <i class="fa-solid fa-hand-pointer text-amber-400 animate-pulse"></i>
      <span>ドラッグで移動 / ホイールでズーム</span>
    </div>

    <!-- Quick Floating Controls -->
    <div id="floating-controls" class="absolute bottom-6 right-6 z-10 bg-slate-800/90 border border-slate-700/60 backdrop-blur rounded-xl p-1.5 flex items-center gap-1 shadow-2xl">
      <button id="zoom-out-btn" class="w-9 h-9 rounded-lg hover:bg-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition-colors" title="縮小">
        <i class="fa-solid fa-minus"></i>
      </button>
      <span id="zoom-level" class="text-xs font-mono w-12 text-center text-slate-300">100%</span>
      <button id="zoom-in-btn" class="w-9 h-9 rounded-lg hover:bg-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition-colors" title="拡大">
        <i class="fa-solid fa-plus"></i>
      </button>
      <div class="w-px h-5 bg-slate-700 mx-1"></div>
      <button id="lock-btn" class="w-9 h-9 rounded-lg hover:bg-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition-colors" title="ドラッグ固定切替">
        <i class="fa-solid fa-lock-open" id="lock-icon"></i>
      </button>
    </div>

    <!-- DRAGGABLE PAPER CONTAINER -->
    <div id="paper-transform-wrapper" class="absolute transform-gpu transition-transform duration-75 ease-out">
      
      <!-- Paper Surface (A4 Ratio Aspect: Standard Vertical Page - Modern Horizontal Writing) -->
      <div id="paper-doc" class="paper-texture paper-shadow text-slate-900 rounded-sm relative transition-shadow duration-200" 
           style="width: 480px; height: 678px; padding: 50px 48px;">
        
        <!-- Elegant Border Frame -->
        <div class="w-full h-full border border-slate-300/80 p-8 flex flex-col justify-between relative overflow-hidden paper-content">
          
          <!-- Document Header (Title Centered) -->
          <div>
            <h1 class="text-2xl font-bold tracking-[0.4em] text-center text-slate-900 mb-8 pt-2" id="view-title">
              退職届
            </h1>

            <!-- Date Right-aligned -->
            <div class="text-right text-xs text-slate-700 tracking-wider mb-8" id="view-date">
              令和〇年〇月〇日
            </div>

            <!-- Recipient Left-aligned -->
            <div class="text-sm font-semibold tracking-wide text-slate-800 mb-8" id="view-company">
              株式会社サンプル 代表取締役 殿
            </div>
          </div>

          <!-- Document Body (Horizontal Left-to-Right) -->
          <div class="text-sm text-slate-800 space-y-4 my-2 leading-relaxed">
            <p>
              私事、このたび<span id="view-reason" class="underline underline-offset-4 decoration-slate-300">一身上の都合</span>により、
              <span id="view-resign-date" class="font-semibold text-slate-900">令和〇年〇月〇日</span>をもって退職いたしたく、ここにお届け申し上げます。
            </p>
          </div>

          <!-- Footer / Author Section Right-aligned -->
          <div class="pt-8 flex flex-col items-end text-sm">
            <div id="view-dept" class="text-xs text-slate-600 mb-1 tracking-wider">
              営業部 営業第一課
            </div>
            <div class="flex items-center gap-4">
              <span id="view-name" class="font-bold text-base tracking-widest text-slate-900">山田 太郎</span>
              <!-- Hanko / Seal Frame -->
              <div class="w-7 h-7 border-2 border-red-600/70 rounded-full flex items-center justify-center text-[10px] text-red-600/80 font-bold select-none rotate-6 opacity-80" title="押印">
                印
              </div>
            </div>
          </div>

        </div>

        <!-- Subtle paper overlay gradient -->
        <div class="absolute inset-0 bg-gradient-to-b from-white/20 via-transparent to-black/5 pointer-events-none"></div>
      </div>

    </div>

  </main>

  <!-- ================= PRINT CONTAINER (Hidden in Screen View) ================= -->
  <div id="print-area">
    <div class="print-paper paper-texture p-16 mx-auto text-slate-900" style="width: 210mm; min-height: 297mm;">
      <div class="w-full h-full border border-slate-300 p-12 flex flex-col justify-between" style="font-family: 'Shippori Mincho', 'Noto Serif JP', serif; line-height: 2.2;">
        
        <div>
          <!-- Title -->
          <h1 class="text-3xl font-bold tracking-[0.5em] text-center text-slate-900 mb-12 pt-4" id="print-title">退職届</h1>

          <!-- Date -->
          <div class="text-right text-base text-slate-800 tracking-wider mb-10" id="print-date"></div>

          <!-- Company -->
          <div class="text-lg font-bold text-slate-900 mb-12" id="print-company"></div>
        </div>

        <!-- Body Statement -->
        <div class="text-lg text-slate-900 space-y-6 my-6 leading-loose">
          <p>
            私事、このたび<span id="print-reason">一身上の都合</span>により、
            <span id="print-resign-date" class="font-bold"></span>をもって退職いたしたく、ここにお届け申し上げます。
          </p>
        </div>

        <!-- Author / Hanko -->
        <div class="pt-12 flex flex-col items-end text-lg">
          <div id="print-dept" class="text-base text-slate-700 mb-2"></div>
          <div class="flex items-center gap-6">
            <span id="print-name" class="font-bold text-2xl tracking-widest text-slate-900"></span>
            <div class="w-9 h-9 border-2 border-red-600 rounded-full flex items-center justify-center text-xs text-red-600 font-bold rotate-6">
              印
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // --- State Management ---
    const todayStr = new Date().toISOString().split('T')[0];

    const state = {
      title: '退職届',
      company: '',
      dept: '',
      name: '',
      date: todayStr, // Both Submission and Effective date linked to this
      reasonPreset: '一身上の都合により',
      reasonCustom: '',
      // Canvas transform state
      x: 0,
      y: 0,
      scale: 1,
      isDragging: false,
      isLocked: false,
      dragStart: { x: 0, y: 0 }
    };

    // --- Local Storage Key ---
    const STORAGE_KEY = 'taishokutodoke_app_data_v2';

    // --- DOM Elements ---
    const workspace = document.getElementById('workspace');
    const paperTransform = document.getElementById('paper-transform-wrapper');
    const lockBtn = document.getElementById('lock-btn');
    const lockIcon = document.getElementById('lock-icon');
    const zoomInBtn = document.getElementById('zoom-in-btn');
    const zoomOutBtn = document.getElementById('zoom-out-btn');
    const zoomLevelEl = document.getElementById('zoom-level');
    const resetPosBtn = document.getElementById('reset-pos-btn');
    const printBtn = document.getElementById('print-btn');
    const togglePanelBtn = document.getElementById('toggle-panel-btn');
    const formContainer = document.getElementById('form-container');
    const panelChevron = document.getElementById('panel-chevron');

    // Input Elements
    const inputTitle = document.getElementById('input-title');
    const inputCompany = document.getElementById('input-company');
    const inputDept = document.getElementById('input-dept');
    const inputName = document.getElementById('input-name');
    const inputDate = document.getElementById('input-date');
    const inputReasonPreset = document.getElementById('input-reason-preset');
    const inputReasonCustom = document.getElementById('input-reason-custom');

    // Display Elements (Screen Paper Preview)
    const viewTitle = document.getElementById('view-title');
    const viewCompany = document.getElementById('view-company');
    const viewDept = document.getElementById('view-dept');
    const viewName = document.getElementById('view-name');
    const viewDate = document.getElementById('view-date');
    const viewResignDate = document.getElementById('view-resign-date');
    const viewReason = document.getElementById('view-reason');

    // Print Elements
    const printTitle = document.getElementById('print-title');
    const printCompany = document.getElementById('print-company');
    const printDept = document.getElementById('print-dept');
    const printName = document.getElementById('print-name');
    const printDate = document.getElementById('print-date');
    const printResignDate = document.getElementById('print-resign-date');
    const printReason = document.getElementById('print-reason');

    // --- Helper: Format Date to Japanese Wareki (和暦 / 令和) ---
    function formatJapaneseDate(dateString) {
      if (!dateString) return '';
      const d = new Date(dateString);
      if (isNaN(d.getTime())) return dateString;

      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const day = d.getDate();

      if (year >= 2019) {
        const reiwaYear = year - 2018;
        const yearStr = reiwaYear === 1 ? '元' : reiwaYear;
        return `令和${yearStr}年${month}月${day}日`;
      }
      return `${year}年${month}月${day}日`;
    }

    // --- Save & Load LocalStorage ---
    function saveData() {
      const dataToSave = {
        title: state.title,
        company: state.company,
        dept: state.dept,
        name: state.name,
        date: state.date,
        reasonPreset: state.reasonPreset,
        reasonCustom: state.reasonCustom
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
      } catch (e) {
        console.warn('LocalStorage save failed', e);
      }
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.title = parsed.title || state.title;
          state.company = parsed.company || '';
          state.dept = parsed.dept || '';
          state.name = parsed.name || '';
          state.date = parsed.date || todayStr;
          state.reasonPreset = parsed.reasonPreset || state.reasonPreset;
          state.reasonCustom = parsed.reasonCustom || '';
        }
      } catch (e) {
        console.warn('LocalStorage load failed', e);
      }
    }

    // --- Update Paper View & Inputs ---
    function updateUI() {
      // Inputs Sync
      inputTitle.value = state.title;
      inputCompany.value = state.company;
      inputDept.value = state.dept;
      inputName.value = state.name;
      inputDate.value = state.date;
      inputReasonPreset.value = state.reasonPreset;
      inputReasonCustom.value = state.reasonCustom;

      if (state.reasonPreset === 'custom') {
        inputReasonCustom.classList.remove('hidden');
      } else {
        inputReasonCustom.classList.add('hidden');
      }

      // Reason Text
      const reasonText = state.reasonPreset === 'custom' 
        ? (state.reasonCustom || '一身上の都合') 
        : state.reasonPreset;

      const formattedDate = formatJapaneseDate(state.date);

      // Update Screen Paper Preview
      viewTitle.textContent = state.title;
      viewCompany.textContent = state.company || '株式会社サンプル 代表取締役 殿';
      viewDept.textContent = state.dept || '所属部署 未入力';
      viewName.textContent = state.name || '氏名 未入力';
      viewDate.textContent = formattedDate;
      viewResignDate.textContent = formattedDate;
      viewReason.textContent = reasonText;

      // Update Print Area
      printTitle.textContent = state.title;
      printCompany.textContent = state.company || '株式会社サンプル 代表取締役 殿';
      printDept.textContent = state.dept;
      printName.textContent = state.name;
      printDate.textContent = formattedDate;
      printResignDate.textContent = formattedDate;
      printReason.textContent = reasonText;
    }

    // --- Canvas Transform Matrix Update ---
    function updateTransform() {
      paperTransform.style.transform = `translate3d(${state.x}px, ${state.y}px, 0px) scale(${state.scale})`;
      zoomLevelEl.textContent = `${Math.round(state.scale * 100)}%`;
    }

    // Centering Paper in Canvas
    function centerPaper() {
      state.x = 0;
      state.y = 0;
      const screenWidth = window.innerWidth;
      if (screenWidth < 640) {
        state.scale = 0.65;
      } else {
        state.scale = 0.95;
      }
      updateTransform();
    }

    // --- Drag & Drop Handlers ---
    function onPointerDown(e) {
      if (state.isLocked) return;
      if (e.target.closest('#floating-controls') || e.target.closest('#ui-panel')) return;

      state.isDragging = true;
      state.dragStart = {
        x: e.clientX - state.x,
        y: e.clientY - state.y
      };
      workspace.style.cursor = 'grabbing';
    }

    function onPointerMove(e) {
      if (!state.isDragging) return;
      state.x = e.clientX - state.dragStart.x;
      state.y = e.clientY - state.dragStart.y;
      updateTransform();
    }

    function onPointerUp() {
      state.isDragging = false;
      workspace.style.cursor = 'grab';
    }

    // Wheel Zooming
    function onWheel(e) {
      if (e.target.closest('#ui-panel')) return;
      e.preventDefault();
      const zoomFactor = 0.08;
      if (e.deltaY < 0) {
        state.scale = Math.min(state.scale + zoomFactor, 2.5);
      } else {
        state.scale = Math.max(state.scale - zoomFactor, 0.4);
      }
      updateTransform();
    }

    // --- Event Listeners Bindings ---
    function setupEventListeners() {
      const handleInput = () => {
        state.title = inputTitle.value;
        state.company = inputCompany.value;
        state.dept = inputDept.value;
        state.name = inputName.value;
        state.date = inputDate.value;
        state.reasonPreset = inputReasonPreset.value;
        state.reasonCustom = inputReasonCustom.value;

        saveData();
        updateUI();
      };

      inputTitle.addEventListener('change', handleInput);
      inputCompany.addEventListener('input', handleInput);
      inputDept.addEventListener('input', handleInput);
      inputName.addEventListener('input', handleInput);
      inputDate.addEventListener('change', handleInput);
      inputReasonPreset.addEventListener('change', handleInput);
      inputReasonCustom.addEventListener('input', handleInput);

      // Workspace Dragging Events
      workspace.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      // Touch Events for Mobile
      workspace.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          onPointerDown(e.touches[0]);
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && state.isDragging) {
          onPointerMove(e.touches[0]);
        }
      }, { passive: true });

      window.addEventListener('touchend', onPointerUp);

      // Wheel Zooming
      workspace.addEventListener('wheel', onWheel, { passive: false });

      // Floating Zoom Controls
      zoomInBtn.addEventListener('click', () => {
        state.scale = Math.min(state.scale + 0.15, 2.5);
        updateTransform();
      });

      zoomOutBtn.addEventListener('click', () => {
        state.scale = Math.max(state.scale - 0.15, 0.4);
        updateTransform();
      });

      resetPosBtn.addEventListener('click', centerPaper);

      // Drag Lock Toggle
      lockBtn.addEventListener('click', () => {
        state.isLocked = !state.isLocked;
        if (state.isLocked) {
          lockIcon.className = 'fa-solid fa-lock text-amber-400';
          lockBtn.classList.add('bg-slate-700');
        } else {
          lockIcon.className = 'fa-solid fa-lock-open';
          lockBtn.classList.remove('bg-slate-700');
        }
      });

      // Mobile Side Panel Collapse
      togglePanelBtn.addEventListener('click', () => {
        formContainer.classList.toggle('hidden');
        panelChevron.classList.toggle('rotate-180');
      });

      // Print Action
      printBtn.addEventListener('click', () => {
        window.print();
      });

      window.addEventListener('resize', () => {
        updateTransform();
      });
    }

    // --- Initialization ---
    window.onload = function() {
      loadData();
      updateUI();
      centerPaper();
      setupEventListeners();
    };
  </script>
</body>
</html>
